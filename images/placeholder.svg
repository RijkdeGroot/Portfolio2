<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <pattern id="bp-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Blueprint background -->
  <rect width="600" height="375" fill="#082242"/>
  <rect width="600" height="375" fill="url(#bp-grid)"/>
  <!-- Wireframe diagonal cross lines matching blueprint drawing -->
  <line x1="0" y1="0" x2="600" y2="375" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="600" y1="0" x2="0" y2="375" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="0" y="0" width="600" height="375" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Center technical indicator -->
  <rect x="260" y="157" width="80" height="60" fill="#0c3260" stroke="#ffffff" stroke-width="2" rx="4"/>
  <text x="300" y="196" fill="#38bdf8" font-family="'Andada Pro', Georgia, monospace" font-size="28" font-weight="bold" text-anchor="middle">-</text>
</svg>
